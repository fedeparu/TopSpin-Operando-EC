name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run offline source tests
        run: python -m pytest -q -m "not real" --ignore=tests/test_browser.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir work/dist .
      - name: Package committed source
        run: python scripts/package_source.py --output work/dist/ecnmr-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ecnmr-${{ matrix.os }}-packages
          path: work/dist/*
